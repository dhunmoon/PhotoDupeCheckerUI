[package]
name = "dupe_finder"
version = "0.1.0"
edition = "2024"
description = "Find and remove duplicate files and visually similar photos"
authors = ["dhunmoon"]
license = "MIT"
repository = "https://github.com/dhunmoon/PhotoDupeCheckerUI"
readme = "README.md"
keywords = ["duplicate", "photos", "dedupe", "gui"]
categories = ["filesystem", "multimedia::images"]

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
egui_extras = "0.37.0"
image = "0.25.10"
jpeg-decoder = "0.3.2"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# Image decoding/hashing is very slow without optimizations, so optimize deps even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# ---- Linux packages (see packaging/package-linux.sh) ----

[package.metadata.deb]
name = "dupe-finder"
maintainer = "dhunmoon"
section = "utils"
priority = "optional"
# The binary links only glibc; GUI libraries are loaded at runtime when present.
depends = "libc6 (>= 2.28)"
recommends = "libxkbcommon0, libgl1, libwayland-client0, libxkbcommon-x11-0, xdg-desktop-portal | zenity"
extended-description = """\
Dupe Finder scans folders for duplicate files by content, name or size, and finds \
visually similar photos saved in different formats or sizes. Review groups side by \
side and move unwanted copies to the system trash."""
assets = [
    ["target/release/dupe_finder", "usr/bin/dupe_finder", "755"],
    ["packaging/linux/dupe-finder.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/dupe-finder.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "dupe-finder"
summary = "Find and remove duplicate files and visually similar photos"
license = "MIT"
assets = [
    { source = "target/release/dupe_finder", dest = "/usr/bin/dupe_finder", mode = "755" },
    { source = "packaging/linux/dupe-finder.desktop", dest = "/usr/share/applications/dupe-finder.desktop", mode = "644" },
    { source = "packaging/linux/dupe-finder.png", dest = "/usr/share/icons/hicolor/256x256/apps/dupe-finder.png", mode = "644" },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
glibc = ">= 2.28"
