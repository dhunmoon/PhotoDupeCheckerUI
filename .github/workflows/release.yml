name: Release

# Push a tag like `v0.1.0` (matching the version in Cargo.toml) to build every
# platform and publish a GitHub Release. "Run workflow" from the Actions tab builds
# the same artifacts without publishing (download them from the run summary).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  linux:
    needs: check-version
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          # Native ARM runner, so appimagetool for arm64 can run.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # zig lets cargo-zigbuild link against glibc 2.28, so one binary runs on
      # Debian 10+, Ubuntu 18.10+, RHEL/Rocky/Alma 8+, Fedora 29+, Arch, etc.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm
      - name: Install bsdtar and zstd (for the Arch package)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      - run: ./packaging/package-linux.sh ${{ matrix.arch }}
      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check-version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: apple-silicon
          - target: x86_64-apple-darwin
            name: intel
    # Apple Silicon runner; the Intel build is cross-compiled with the same Xcode SDK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: ./packaging/package-macos.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: check-version
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          # 32-bit build, cross-compiled on the x64 runner (MSVC ships x86 tools).
          - arch: x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Inno Setup (if missing)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
        shell: pwsh
      - run: ./packaging/package-windows.ps1 -Arch ${{ matrix.arch }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: packaging/release-notes.md
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
