[package]
name = "dupe_finder"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
egui_extras = "0.37.0"
image = "0.25.10"
jpeg-decoder = "0.3.2"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# Image decoding/hashing is very slow without optimizations, so optimize deps even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
